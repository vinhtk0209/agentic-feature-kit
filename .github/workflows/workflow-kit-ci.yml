# Workflow Kit CI — runs the deterministic self-test + drift gates for the
# .claude/ feature-from-confluence toolchain on every PR / push to develop|main.
#
# Scope note: this qualifies the workflow kit on both supported release
# platforms. Full host-application checks remain outside this kit boundary.
name: Workflow Kit CI

on:
  pull_request:
  push:
    branches: [develop, main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit-verify:
    name: Kit verify (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
          - platform: windows
            os: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Confluence MCP dependencies
        working-directory: .claude/mcp-server
        run: npm ci --ignore-scripts
      - name: Run cross-platform smoke
        env:
          QUALIFICATION_PLATFORM: ${{ matrix.platform }}
          QUALIFICATION_OUT: artifacts/cross-platform/${{ matrix.platform }}.json
        run: npm run test:cross-platform
      - name: Run workflow-kit self-test + drift gates
        run: npm run test:kit
      - name: Run committed-clone release qualification
        env:
          CLEAN_CLONE_SOURCE: .
          CLEAN_CLONE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          CLEAN_CLONE_PLATFORM: ${{ matrix.platform }}
          CLEAN_CLONE_OUT: artifacts/public-release/r5d/${{ matrix.platform }}.json
        run: npm run qualify:public-release-clean-clone
      - name: Upload platform qualification
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: qualification-${{ matrix.platform }}
          path: |
            artifacts/cross-platform/${{ matrix.platform }}.json
            artifacts/public-release/r5d/${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 14

  release-gate:
    name: Release qualification gate
    if: always()
    needs: [kit-verify]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MATRIX_RESULT: ${{ needs.kit-verify.result }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install gate dependencies
        run: npm ci --ignore-scripts
      - name: Download platform qualifications
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: qualification-*
          path: artifacts
          merge-multiple: true
      - name: Require the complete successful matrix
        run: npm run release:matrix-gate -- artifacts/cross-platform
      - name: Require clean-clone Linux/Windows parity
        env:
          CLEAN_CLONE_MATRIX_DIR: artifacts/public-release/r5d
        run: npm run release:clean-clone-matrix-gate
      - name: Publish qualification summary
        if: always()
        env:
          QUALIFICATION_MATRIX_RESULT: ${{ needs.kit-verify.result }}
          AGGREGATE_RESULT: ${{ job.status }}
        shell: bash
        run: |
          {
            printf '## Workflow Kit qualification\n\n'
            printf -- '- Matrix result: `%s`\n' "$QUALIFICATION_MATRIX_RESULT"
            printf -- '- Aggregate gate: `%s`\n' "$AGGREGATE_RESULT"
            printf -- '- Committed-clone matrix: `%s`\n' "$AGGREGATE_RESULT"
            printf -- '- Platforms: Linux and Windows\n'
            printf -- '- Repository permissions: read-only\n'
          } >> "$GITHUB_STEP_SUMMARY"
